name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Playwright 1.56 has no browser build for Ubuntu 26.04 (the new ubuntu-latest), so pin the image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Built files are committed
        run: git diff --exit-code -- dist || (echo "dist/ is out of date. Run npm run build and commit it." && exit 1)
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Bundle size
        run: |
          for f in dist/index.js dist/core.js; do echo "$f: $(gzip -9c $f | wc -c) bytes gzipped"; done